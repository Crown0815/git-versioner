name: Move major version tag

on:
  workflow_dispatch:
    inputs:
      major-tag:
        description: 'Moving major tag to create or update (e.g. v0 or v1)'
        required: true
        type: string
      target-release:
        description: 'Existing stable release tag to point at (e.g. v0.20.1). Leave empty to use the latest stable release.'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  move-tag:
    name: Move major tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve target release and move tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_MAJOR_TAG: ${{ inputs.major-tag }}
          REQUESTED_RELEASE_TAG: ${{ inputs.target-release }}
        run: |
          set -euo pipefail

          if [[ ! "$REQUESTED_MAJOR_TAG" =~ ^v[0-9]+$ ]]; then
            echo "::error::major-tag must match v<MAJOR> (e.g. v0 or v1), got '$REQUESTED_MAJOR_TAG'"
            exit 1
          fi

          RELEASE_TAG="$REQUESTED_RELEASE_TAG"
          if [[ -z "$RELEASE_TAG" ]]; then
            RELEASE_TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=30" \
              --jq '[.[] | select(.draft == false and .prerelease == false) | .tag_name] | .[0] // empty')"
            if [[ -z "$RELEASE_TAG" ]]; then
              echo "::error::Could not find a latest stable release to point $REQUESTED_MAJOR_TAG at"
              exit 1
            fi
            echo "No target release given; using latest stable release $RELEASE_TAG"
          fi

          bash .github/scripts/update-major-tag.sh --to-release "$RELEASE_TAG" "$REQUESTED_MAJOR_TAG"
